# Self-contained Windows build for self-hosted / "own S3" use.
# Derived from nightly.yml, but WITHOUT any repo-scoped secrets:
#   - no Tauri updater signing  (tauri.conf: createUpdaterArtifacts=false)
#   - no R2 upload              (uses actions/upload-artifact instead)
# Manual trigger only. Produces a portable exe (NEXT_PUBLIC_PORTABLE_APP=true)
# plus a NSIS installer of the same flavor.
name: Build Windows unlocked

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-windows:
    runs-on: windows-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        config:
          - { arch: x86_64, rust_target: x86_64-pc-windows-msvc }
          # 需要 ARM64 时取消注释下方并重新触发：
          # - { arch: arm64, rust_target: aarch64-pc-windows-msvc }
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: initialize git submodules
        run: git submodule update --init --recursive

      - name: setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      # 不填 version，让 action 读取根 package.json 的 packageManager 字段 (pnpm@11)

      - name: setup node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v6
        with:
          node-version: 24
          cache: pnpm

      - name: install dependencies
        run: pnpm install --frozen-lockfile --prefer-offline

      - name: copy pdfjs-dist and simplecc-dist to public directory
        run: pnpm --filter @readest/readest-app setup-vendors

      - name: install Rust stable
        uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.config.rust_target }}

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          key: build-windows-${{ matrix.config.arch }}-cargo

      # Portable build for self-hosted desktop use. No secrets involved.
      - name: create .env.local for portable build
        shell: bash
        run: |
          echo "NEXT_PUBLIC_APP_PLATFORM=tauri" >> apps/readest-app/.env.local
          echo "NEXT_PUBLIC_PORTABLE_APP=true" >> apps/readest-app/.env.local

      - name: build Windows bundle
        shell: bash
        env:
          NODE_OPTIONS: '--max-old-space-size=8192'
        run: |
          cd apps/readest-app
          pnpm tauri build --target ${{ matrix.config.rust_target }} --bundles nsis

      - name: collect artifacts
        shell: bash
        run: |
          mkdir -p dist
          # Portable raw exe (NEXT_PUBLIC_PORTABLE_APP=true flavor)
          cp target/${{ matrix.config.rust_target }}/release/readest.exe dist/Readest_${{ matrix.config.arch }}_portable.exe
          # NSIS installer (same flavor)
          cp target/${{ matrix.config.rust_target }}/release/bundle/nsis/*.exe dist/ || true

      - name: upload artifacts
        uses: actions/upload-artifact@v4 # 官方 tag，避免 fork 上 SHA 不可解析
        with:
          name: readest-windows-${{ matrix.config.arch }}
          path: dist/
          if-no-files-found: error